[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "con24ma"
version = "1.0.0"
dependencies = []
requires-python = ">=3.9"
authors = [
  {name = "Linqa Kiriyama", email = "kyamlinqa@gmail.com"},
]
description = "Configuration tools"
readme = "README.md"
license = {file = "LICENSE.txt"}
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only"
]

[project.urls]
Homepage = "https://example.com"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/qaiLN/con24ma.git"
"Bug Tracker" = "https://github.com/qaiLN/con24ma/issues"
Changelog = "https://github.com/qaiLN/con24ma/blob/master/CHANGELOG.md"

[project.scripts]
pandapp = "con24ma:main"
