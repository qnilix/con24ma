[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "con24ma"
version = "1.1.0"
dependencies = []
requires-python = ">=3.10"
authors = [
  {name = "Linqa Kiriyama", email = "kyamlinqa@gmail.com"},
]
description = "Configuration tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only"
]

[project.urls]
Homepage = "https://example.com"
Documentation = "https://con24ma.readthedocs.io/"
Repository = "https://github.com/qnilix/con24ma.git"
"Bug Tracker" = "https://github.com/qnilix/con24ma/issues"
Changelog = "https://github.com/qnilix/con24ma/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["con24ma*"]

[project.scripts]
pandapp = "con24ma:main"
